{{- /* Dev and scratch clusters only. Production Secrets are provisioned out of band. */ -}}
{{- if .Values.appSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appSecrets.secretName }}
  labels:
    {{- include "{{app}}.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ required "appSecrets.authSecret is required when appSecrets.create=true" .Values.appSecrets.authSecret | quote }}
{{- end }}
{{- if .Values.postgresAuth.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.auth.existingSecret }}
  labels:
    {{- include "{{app}}.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgresAuth.password is required when postgresAuth.create=true" .Values.postgresAuth.password | quote }}
  postgres-password: {{ required "postgresAuth.postgresPassword is required when postgresAuth.create=true" .Values.postgresAuth.postgresPassword | quote }}
{{- end }}
