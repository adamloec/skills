apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{app}}-api
  labels:
    app: {{app}}-api
    {{- include "{{app}}.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  # Migrates at start (image entrypoint), so two versions must never overlap.
  strategy:
    type: Recreate
  # The default of 10 hoards stale ReplicaSets.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{app}}-api
  template:
    metadata:
      labels:
        app: {{app}}-api
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: {{app}}-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          # args, not command, so the image ENTRYPOINT (migrations) still runs.
          args: {{ .Values.api.command | toJson }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: {{APP}}_VERSION
              value: {{ .Chart.Version | quote }}
            - name: {{APP}}_DEBUG
              value: {{ .Values.api.env.{{APP}}_DEBUG | quote }}
            - name: {{APP}}_PUBLIC_URL
              value: {{ include "{{app}}.publicOrigin" . | quote }}
            {{- include "{{app}}.dbEnv" (dict "root" $ "db" .Values.postgresql.auth.database) | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
