{{- /* The whole public surface. One Ingress per host, each gated on its host being set. */ -}}
{{- if .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{app}}
  labels:
    app: {{app}}
    {{- include "{{app}}.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    {{- if .Values.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.certManager.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.certManager.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{app}}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Everything goes to the web app; its server side calls the API in-cluster.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{app}}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
